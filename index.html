<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告 Demo 主页面</title>
  <style>
    :root {
      --bg-1: #09111c;
      --bg-2: #101a28;
      --panel: rgba(12, 20, 32, 0.78);
      --panel-border: rgba(167, 243, 208, 0.16);
      --text: #f7fbff;
      --muted: #9fb2c8;
      --brand: #2dd4bf;
      --brand-strong: #14b8a6;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(45, 212, 191, 0.2), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 24%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .shell {
      width: min(920px, 100%);
      padding: 40px 28px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(45, 212, 191, 0.12);
      color: #99f6e4;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .demo-link {
      display: block;
      padding: 24px 22px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03)),
        rgba(15, 23, 36, 0.88);
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .demo-link:hover {
      transform: translateY(-2px);
      border-color: rgba(45, 212, 191, 0.42);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }

    .demo-tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.14);
      color: #99f6e4;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .demo-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .demo-desc {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .shell {
        padding: 28px 20px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .demo-title {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <span class="eyebrow">AI Ads Demo Hub</span>
    <h1>选择要查看的广告演示页面</h1>
    <p>点击下面任一按钮，会在新标签页打开对应 demo。一个是视频前广告场景，另一个是视频中广告场景。</p>

    <section class="actions" aria-label="Demo 入口">
      <a class="demo-link" href="./demo1/index.html" target="_blank" rel="noopener noreferrer">
        <span class="demo-tag">Demo 1</span>
        <h2 class="demo-title">demo1-视频前广告</h2>
        <p class="demo-desc">打开前贴片广告与跳过行为分析的演示页面。</p>
      </a>

      <a class="demo-link" href="./demo2/index.html" target="_blank" rel="noopener noreferrer">
        <span class="demo-tag">Demo 2</span>
        <h2 class="demo-title">demo2-视频中广告</h2>
        <p class="demo-desc">打开视频中广告与风格重绘的演示页面。</p>
      </a>
    </section>
  </main>
</body>
</html>
