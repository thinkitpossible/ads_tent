<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告爆炸视频APP - SPA模拟</title>
  <style>
    :root {
      --bg: #f3f6ff;
      --surface: #ffffff;
      --surface-2: #f6f9ff;
      --text: #16233d;
      --muted: #667799;
      --accent: #ffd333;
      --danger: #ff4157;
      --danger-2: #ff7a00;
      --ok: #27d17f;
      --line: #d6e1f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f8faff 0%, #edf3ff 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 0 10px;
    }

    .app {
      width: min(100vw - 20px, 390px);
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      padding-bottom: 78px;
      border-left: 1px solid #dbe6fb;
      border-right: 1px solid #dbe6fb;
      background: #f5f8ff;
      overflow-x: hidden;
      box-shadow: 0 10px 36px rgba(41, 70, 126, 0.12);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(247, 251, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
    }

    .topbar.hidden {
      display: none;
    }

    .filter-header {
      display: none;
      position: sticky;
      top: 0;
      z-index: 41;
      background: rgba(247, 251, 255, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      align-items: center;
      gap: 10px;
    }

    .filter-header.show {
      display: flex;
    }

    .back-btn {
      border: 1px solid #c7d7f5;
      background: #ffffff;
      color: #33507f;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-title {
      font-size: 15px;
      font-weight: 800;
      color: #1e3258;
    }

    .search-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid #c7d7f5;
      background: #ffffff;
      color: #4f6186;
      font-size: 13px;
    }

    .cat-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      background: linear-gradient(120deg, #ffd333, #ff9b0b);
      color: #241800;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-tabs {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .quick-tabs::-webkit-scrollbar { display: none; }

    .quick-tab {
      border: 1px solid #c7d7f5;
      background: #ffffff;
      color: #3a4f79;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .quick-tab.active {
      background: linear-gradient(120deg, #2f5dc9, #4b7cff);
      border-color: #6e93ff;
      color: #fff;
    }

    .banner {
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #344566;
      height: 136px;
    }

    .banner-track {
      display: flex;
      height: 100%;
      transition: transform 0.45s ease;
    }

    .banner-item {
      min-width: 100%;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      position: relative;
    }

    .banner-item::before {
      content: "广告";
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      color: #2b1b00;
      background: #ffd333;
      border-radius: 8px;
      padding: 2px 6px;
      font-weight: 700;
    }

    .banner-item.drama::before {
      content: "电视剧";
      color: #0d2b5f;
      background: #8dc2ff;
    }

    .b1 { background: linear-gradient(135deg, #511111, #ff4157 45%, #ff9f20); }
    .b2 { background: linear-gradient(135deg, #173255, #3568d4, #27d1a2); }
    .b3 { background: linear-gradient(135deg, #2e133f, #9b39c2, #ff55c2); }

    .banner-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .banner-sub {
      font-size: 12px;
      color: #ffffff;
      opacity: 0.95;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .page {
      display: none;
      padding: 12px;
      animation: fade 0.3s ease;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .page.active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0.3; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      margin: 14px 2px 10px;
      font-size: 14px;
      color: #2a3f67;
      letter-spacing: 0.5px;
    }

    .feed, .section-grid {
      display: grid;
      gap: 10px;
    }

    #homeFeed {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      background: var(--surface);
      border: 1px solid #d6e3fb;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb {
      height: 92px;
      background: linear-gradient(130deg, #22314d, #2f4c7f 40%, #4f6aa1);
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 8px;
    }

    .duration {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 6px;
      padding: 2px 6px;
    }

    .meta {
      padding: 8px 10px 10px;
    }

    .title {
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
    }

    .ad-card {
      border: 1px solid #7b2f00;
      background: linear-gradient(120deg, rgba(255, 122, 0, 0.28), rgba(255, 65, 87, 0.2));
      box-shadow: 0 0 0 1px rgba(255, 188, 49, 0.25) inset;
    }

    .ad-card .thumb {
      background: linear-gradient(135deg, #8e2300, #ff4a00 45%, #ffc837);
    }

    .ad-tag {
      font-size: 10px;
      font-weight: 700;
      color: #341500;
      background: #ffd333;
      border-radius: 6px;
      padding: 1px 6px;
      margin-left: 6px;
    }

    .module {
      margin-top: 14px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #d6e3fb;
      background: linear-gradient(180deg, #ffffff, #f6f9ff);
    }

    .section-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mini-card {
      background: var(--surface-2);
      border: 1px solid #d8e4fb;
      border-radius: 10px;
      padding: 10px;
      min-height: 68px;
      font-size: 13px;
      display: flex;
      align-items: center;
      line-height: 1.3;
    }

    .floating-ad {
      position: fixed;
      right: 22px;
      bottom: 96px;
      z-index: 55;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      color: #230f00;
      background: linear-gradient(120deg, #ffeb3b, #ff6f00);
      box-shadow: 0 8px 24px rgba(255, 117, 24, 0.46);
      animation: pulse 1.8s infinite;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 390px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #ffffff;
      border-top: 1px solid var(--line);
      z-index: 50;
    }

    .nav-btn {
      padding: 10px 4px 12px;
      text-align: center;
      font-size: 12px;
      color: #6d7ea3;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(255, 211, 51, 0.3);
    }

    .tvp-wrap {
      background: #0a0d14;
      margin: 0;
      position: relative;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .tvp-head {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    }

    .tvp-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.68), rgba(0, 0, 0, 0.1)),
        url("https://puui.qpic.cn/vpic_cover/w41025my54z/w41025my54z_hz.jpg/0") center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: #fff;
      padding: 10px;
      position: relative;
    }

    .tvp-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
    }

    .tvp-progress > span {
      display: block;
      width: 36%;
      height: 100%;
      background: #ffce3d;
    }

    .tvp-time { font-size: 12px; }
    .tvp-full { font-size: 12px; opacity: 0.9; }

    .tvp-body {
      padding: 12px 0 0;
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 100%;
    }

    .tvp-card {
      background: #fff;
      border: 1px solid #d6e3fb;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .tvp-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .tvp-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: #6b7da5;
    }

    .tvp-vip {
      font-size: 10px;
      background: linear-gradient(120deg, #ffd978, #f6a400);
      color: #5b3a00;
      border-radius: 6px;
      padding: 1px 6px;
      font-weight: 700;
    }

    .tvp-ops {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 12px;
      color: #465c89;
    }

    .tvp-op i {
      font-style: normal;
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .tvp-tabs {
      display: flex;
      gap: 16px;
      font-size: 14px;
      border-bottom: 1px solid #e0e8fa;
      margin-bottom: 8px;
      padding-bottom: 8px;
    }

    .tvp-tabs .active {
      font-weight: 700;
      color: #1c335f;
      position: relative;
    }

    .tvp-tabs .active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 3px;
      border-radius: 999px;
      background: #ffcd32;
    }

    .tvp-eps {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      width: 100%;
      max-width: 100%;
    }

    .tvp-eps::-webkit-scrollbar { display: none; }

    .tvp-ep {
      min-width: 58px;
      text-align: center;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid #ccd9f7;
      background: #f9fbff;
      color: #425982;
      font-size: 13px;
    }

    .tvp-ep.active {
      background: #1f3d77;
      color: #fff;
      border-color: #1f3d77;
    }

    .tvp-rec {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 100%;
    }

    .tvp-rec-item {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }

    .tvp-rec-item > div {
      min-width: 0;
    }

    .tvp-rec-thumb {
      width: 120px;
      height: 68px;
      border-radius: 8px;
      border: 1px solid #cad8f7;
      background-size: cover;
      background-position: center;
    }

    .tvp-rec-title {
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .tvp-rec-sub { font-size: 12px; color: #6b7da5; }


    .splash-mask {
      position: fixed;
      inset: 0;
      z-index: 95;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.2) 42%, rgba(0, 0, 0, 0.55)),
        url("http://ossweb-img.qq.com/images/roco/act/a20110727lkwg/wallpaper/7_1_1024.jpg") center/cover no-repeat;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .splash-mask.show {
      display: flex;
    }

    .splash-card {
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 211, 51, 0.55);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff7e3;
      padding: 16px 14px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
    }

    .splash-badge {
      display: inline-block;
      background: #ffd333;
      color: #3d1f00;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 10px;
      margin-bottom: 10px;
    }

    .splash-title {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    }

    .splash-sub {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
      opacity: 0.97;
    }

    .splash-shake-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 11px 10px;
      background: linear-gradient(120deg, #ffe45d, #ffb300);
      color: #3b1d00;
      font-weight: 900;
      cursor: pointer;
      animation: shakePulse 1.2s infinite;
    }

    .splash-tip {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.9;
    }

    .splash-countdown {
      margin-top: 10px;
      font-size: 12px;
      color: #ffe18f;
      font-weight: 700;
    }

    @keyframes shakePulse {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .list-simple .card .thumb { height: 78px; }

    .vip-ad {
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #7a6000;
      background: linear-gradient(130deg, rgba(255, 211, 51, 0.22), rgba(255, 122, 0, 0.18));
      margin-bottom: 12px;
    }

    .event-banner {
      border-radius: 12px;
      border: 1px solid #6030a8;
      padding: 14px;
      background: linear-gradient(120deg, #34115f, #5f20c2 50%, #ac45ff);
      margin-bottom: 12px;
    }

    .rank-list {
      display: grid;
      gap: 10px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #d6e3fb;
      border-radius: 12px;
      padding: 8px;
      align-items: center;
    }

    .rank-poster {
      width: 84px;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #cad9f7;
      background: linear-gradient(135deg, #2a3550, #3f5788);
    }

    .rank-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .rank-sub {
      color: #5f749c;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar" id="globalTopbar"></div>
    <div class="filter-header" id="filterHeader">
      <button class="back-btn" id="filterBackBtn">返回首页</button>

    <main id="pages"></main>

  <nav class="bottom-nav" id="bottomNav">

      <div class="splash-countdown" id="splashCountdown">5 秒后自动关闭</div>
    </div>
  </div>

    }

    document.getElementById("bottomNav").addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-btn");
      if (!btn) return;
      switchRoute(btn.dataset.route, true);
    });
    document.getElementById("filterBackBtn").addEventListener("click", () => switchRoute("home", false));

    function closeSplash() {
      splashMask.classList.remove("show");
    }

    function jumpToRoco() {
      window.location.href = "https://rocom.qq.com/main/";
    }

    function initShakeSplash() {
      const threshold = 18;
      let last = { x: null, y: null, z: null };
      let cooldown = false;
      let seconds = 5;

      document.getElementById("shakeBtn").addEventListener("click", jumpToRoco);
      splashMask.addEventListener("click", jumpToRoco);

      const timer = setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          clearInterval(timer);
          if (splashMask.classList.contains("show")) closeSplash();
          return;
        }
        splashCountdown.textContent = `${seconds} 秒后自动关闭`;
      }, 1000);

      window.addEventListener("devicemotion", (e) => {
        if (!splashMask.classList.contains("show") || cooldown) return;
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;

        const x = acc.x ?? 0;
        const y = acc.y ?? 0;
        const z = acc.z ?? 0;

        if (last.x !== null) {
          const delta = Math.abs(x - last.x) + Math.abs(y - last.y) + Math.abs(z - last.z);
          if (delta > threshold) {
            cooldown = true;
            jumpToRoco();
          }
        }
        last = { x, y, z };
      });
    }

    window.addEventListener("scroll", handleInfiniteAds);
    setInterval(rotateBanner, 2600);
    render();
    initShakeSplash();
  </script>
</body>
</html>
